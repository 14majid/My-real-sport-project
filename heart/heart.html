<!DOCTYPE html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Favorites</title>
    <link rel="stylesheet" href="../styles.css">

    <script src="../js/global.js" defer></script>

    <script>
    document.addEventListener('DOMContentLoaded', () => {
    const container = document.querySelector('.card-baseball');
    let favorites = [];

    try {
        const stored = localStorage.getItem('favorite');

        if (stored) {
            favorites = JSON.parse(stored);
        }
    } catch (error) {
        console.error('Erreur lors de la lecture des favoris:', error);
    }

    if (favorites.length > 0) {

        container.innerHTML = favorites.map(favorite => `
            <div class="card-baseball-content">
                <img 
                    src="${favorite.image}" 
                    alt="${favorite.description || 'Article favori'}"
                    style="max-width: 100%;"
                >

                <div>
                    <h4>${favorite.price || 'Prix non disponible'}</h4>
                    <p>${favorite.description || 'Description non disponible'}</p>
                    <button class="remove-favorite" data-index="${index}">Supprimer</button>
                </div>
            </div>
        `).join('');

    } else {
        container.innerHTML = `
            <p>Aucun article favori sélectionné.</p>
        `;
    }
});
    </script>

</head>
